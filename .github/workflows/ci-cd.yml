name: GBS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-validation:
    name: Backend CI (Node & Prisma)
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gbs_dev?schema=public"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gbs_dev?schema=public"
          PRISMA_CLI_QUERY_ENGINE_TYPE: "binary"

      - name: Validate Prisma Schema & Generate Client
        working-directory: backend
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gbs_dev?schema=public"
          PRISMA_CLI_QUERY_ENGINE_TYPE: "binary"

      - name: Verify Backend Syntax
        working-directory: backend
        run: |
          node --check src/core/server.js
          node --check src/modules/auth/auth.service.js
          node --check src/modules/dev-control/devControl.service.js
          node --check src/modules/sms/sms.service.js

  frontend-validation:
    name: Frontend CI (Vite & React)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Production Build Test
        working-directory: frontend
        run: npm run build
