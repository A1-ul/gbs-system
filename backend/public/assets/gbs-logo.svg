<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Deep Royal Shield Gradient -->
    <radialGradient id="shieldBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group: Centered Crest Shield -->
  <g transform="translate(250, 85)">
    <!-- Shield Outer Gold Trim -->
    <path d="M 0,-65 Q 48,-65 65,-45 Q 68,15 0,68 Q -68,15 -65,-45 Q -48,-65 0,-65 Z"
          fill="url(#goldLinear)" filter="url(#goldGlow)" />
    
    <!-- Shield Inner Slate Fill -->
    <path d="M 0,-60 Q 44,-60 60,-42 Q 62,12 0,62 Q -62,12 -60,-42 Q -44,-60 0,-60 Z"
          fill="url(#shieldBg)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.5" />

    <!-- Crown / Crest Coronet at top of shield -->
    <path d="M -24,-52 L -32,-35 L -16,-40 L 0,-50 L 16,-40 L 32,-35 L 24,-52 Z"
          fill="url(#goldLinear)" />

    <!-- Prominent "GBS" Monogram in Center -->
    <text x="0" y="5"
          fill="url(#goldLinear)"
          font-family="'Playfair Display', Georgia, serif"
          font-size="36"
          font-weight="900"
          letter-spacing="3"
          text-anchor="middle"
          filter="url(#goldGlow)">
      GBS
    </text>

    <!-- Five Golden Stars Under Monogram -->
    <g transform="translate(0, 26) scale(0.65)">
      <polygon points="0,-8 2,-2 8,-2 3,1 5,7 0,3 -5,7 -3,1 -8,-2 -2,-2" fill="#fef08a" transform="translate(-36, 0)" />
      <polygon points="0,-8 2,-2 8,-2 3,1 5,7 0,3 -5,7 -3,1 -8,-2 -2,-2" fill="#fef08a" transform="translate(-18, 0)" />
      <polygon points="0,-8 2,-2 8,-2 3,1 5,7 0,3 -5,7 -3,1 -8,-2 -2,-2" fill="#fef08a" transform="translate(0, -2)" />
      <polygon points="0,-8 2,-2 8,-2 3,1 5,7 0,3 -5,7 -3,1 -8,-2 -2,-2" fill="#fef08a" transform="translate(18, 0)" />
      <polygon points="0,-8 2,-2 8,-2 3,1 5,7 0,3 -5,7 -3,1 -8,-2 -2,-2" fill="#fef08a" transform="translate(36, 0)" />
    </g>
  </g>

  <!-- Company Title -->
  <text x="250" y="180"
        fill="#f8fafc"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="18"
        font-weight="800"
        letter-spacing="2.5"
        text-anchor="middle">
    GBS COMPANY
  </text>

  <!-- Golden Motto Ribbon Background -->
  <g transform="translate(250, 206)">
    <!-- Ribbon shape -->
    <path d="M -175,-14 L -190,-4 L -175,6 L -165,14 L 165,14 L 175,6 L 190,-4 L 175,-14 Z"
          fill="rgba(15, 23, 42, 0.95)" stroke="url(#goldLinear)" stroke-width="1.8" />
    
    <!-- The Sentence: INTELLIGENCE TALKS TO WISDOM -->
    <text x="0" y="4"
          fill="url(#goldLinear)"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="11.5"
          font-weight="900"
          letter-spacing="3"
          text-anchor="middle">
      INTELLIGENCE TALKS TO WISDOM
    </text>
  </g>
</svg>
