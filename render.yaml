services:
  # 1. GBS Unified Enterprise Web Service & API Engine (Node.js + WebSockets + Static SPA)
  - type: web
    name: gbs-system
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: https://gbs-system.onrender.com,https://gbs-school.onrender.com,https://gbs-frontend.onrender.com,https://gbs-schools.com,https://www.gbs-schools.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 24h
      - key: JWT_REFRESH_EXPIRES
        value: 30d
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_MODE
        value: TEST
      - key: HUBTEL_CLIENT_ID
        sync: false
      - key: HUBTEL_CLIENT_SECRET
        sync: false
      - key: HUBTEL_MERCHANT_ACCOUNT_NUMBER
        sync: false
      - key: HUBTEL_WEBHOOK_SECRET
        sync: false
      - key: HUBTEL_MODE
        value: TEST
      - key: ARKESEL_API_KEY
        sync: false
      - key: MNOTIFY_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - fromDatabase:
          name: gbs-db
          property: connectionString
        key: DATABASE_URL

  # 2. GBS High-Performance Static Frontend CDN Service (Optional Separate CDN)
  - type: web
    name: gbs-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gbs-system.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: wss://gbs-system.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

databases:
  # 3. GBS Production PostgreSQL Database
  - name: gbs-db
    databaseName: gbs_production
    user: gbs_admin
    plan: free
