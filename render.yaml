services:
  - type: web
    name: gbs-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: CORS_ORIGIN
        value: https://gbs-schools.com,https://www.gbs-schools.com
      - fromDatabase:
          name: gbs-db
          property: connectionString
        key: DATABASE_URL

  - type: web
    name: gbs-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: gbs-db
    databaseName: gbs_production
    user: gbs_admin
    plan: free
