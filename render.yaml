services:
  # GBS Backend API Service (Express.js + Node)
  - type: web
    name: gbs-backend-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: gbs-postgres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # GBS Frontend Static Web Application
  - type: web
    name: gbs-school-management-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gbs-backend-api
          property: host

databases:
  # Free Managed PostgreSQL Database
  - name: gbs-postgres-db
    plan: free
    region: oregon
    databaseName: gbs_system
    user: gbs_admin
