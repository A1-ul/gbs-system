<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0284c7" />
  <title>GBS School Management System — Offline Mode</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #020617 0%, #0f172a 55%, #1e293b 100%);
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 20px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid rgba(56, 189, 248, 0.45);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid #d4af37;
      margin-bottom: 12px;
      object-fit: cover;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; color: #38bdf8; }
    p { font-size: 0.9rem; color: #cbd5e1; line-height: 1.55; margin: 0 0 18px; }
    button {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #020617;
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="GBS System" />
    <h1>GBS School Management System</h1>
    <p>You are currently offline. Reconnect to Wi-Fi or mobile data and click below to reload your live dashboard and sync saved updates.</p>
    <button type="button" onclick="window.location.href='/'">Reconnect &amp; Reload Portal</button>
  </div>
</body>
</html>
